name: Question Bank Quality Gate

# v2 bank: content lives in data/bank/*.json and is loaded by scripts/bank/load.mjs.
# This gate checks content revisions (distractor-only, no duplicate options, longest-answer
# cue removed in every set a revision file covers), rebuilds the bank (which fails on
# unresolved answer keys, broken case studies, duplicate ids or unknown categories) and
# keeps question content out of migrations.

on:
  pull_request:
    paths:
      - 'data/bank/**'
      - 'scripts/bank/**'
      - 'supabase/migrations/**'
      - '.github/workflows/question-bank-quality.yml'
  push:
    branches: [main]
    paths:
      - 'data/bank/**'
      - 'scripts/bank/**'
      - 'supabase/migrations/**'
      - '.github/workflows/question-bank-quality.yml'

permissions:
  contents: read

jobs:
  validate-bank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check content revisions
        run: node scripts/bank/check-revisions.mjs
      - name: Build and validate the question bank
        run: node scripts/bank/build.mjs
      - name: Summarise answer-key review notes
        run: |
          echo "Low-confidence or order-only key matches (reviewed in data/bank/build/answer_key_review.csv):"
          grep -E ',(LOW-CONFIDENCE|ORDER-ONLY|override)' data/bank/build/answer_key_review.csv | cut -d, -f1-3 | sort | uniq -c || true
      - name: Keep question content out of migrations
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then BASE="${{ github.event.pull_request.base.sha }}"; else BASE="${{ github.event.before }}"; fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then BASE="HEAD~1"; fi
          mapfile -t files < <(git diff --name-only --diff-filter=AM "$BASE" HEAD -- 'supabase/migrations/*.sql')
          if [ ${#files[@]} -eq 0 ]; then echo 'No changed migrations.'; exit 0; fi
          bad=0
          for f in "${files[@]}"; do
            if grep -niE "insert[[:space:]]+into[[:space:]]+(public\.)?(questions|case_studies)\b" "$f"; then
              echo "::error file=$f::Question content belongs in data/bank/*.json and is loaded by scripts/bank/load.mjs, not migrations."
              bad=1
            fi
          done
          exit $bad
