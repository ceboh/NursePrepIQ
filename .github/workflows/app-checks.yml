name: App checks

# Type-checks the app, runs the unit tests (exam assembly, delivery payloads and scoring) and
# lints the code on every change to application code.

on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'utils/**'
      - 'tests/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - 'eslint.config.mjs'
      - '.github/workflows/app-checks.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'utils/**'
      - 'tests/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - 'eslint.config.mjs'
      - '.github/workflows/app-checks.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Lint
        run: npx eslint app components lib tests
