name: Bootstrap Supabase migration history

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type BASELINE to mark the already-applied 0001-0030 migrations as applied'
        required: true
        type: string

permissions:
  contents: read

jobs:
  baseline:
    if: ${{ inputs.confirm == 'BASELINE' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Record existing migrations as already applied
        shell: bash
        run: |
          for v in $(seq -w 1 30); do
            supabase migration repair --status applied "00$v"
          done

      - name: Verify migration history
        run: supabase migration list
